<section class="pu-contacto" id="contacto">
    <div class="pu-wrap">
        <p class="pu-label">Contacto</p>
        <h2 class="pu-h2">Escribinos y te respondemos hoy</h2>
        <p class="pu-section__lead">Asesoría sin cargo y respuesta garantizada en menos de 24 horas.</p>
        <div class="pu-contacto__acciones">
            <a href="{{ contacto.whatsapp_link }}" target="_blank" rel="noopener" class="pu-btn pu-btn--green pu-btn--lg">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 4a8 8 0 0 0-6.9 12l-1 3.6 3.7-1A8 8 0 1 0 12 4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <path d="M9 9c0 3 3 6 6 6l1.2-1.6-2-1-1 .8c-1-.5-1.9-1.4-2.4-2.4l.8-1-1-2L9 9Z" fill="currentColor"/>
                </svg>
                WhatsApp
            </a>
            <a href="mailto:{{ contacto.email }}" class="pu-btn pu-btn--orange pu-btn--lg">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>
                    <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                Enviar un email
            </a>
        </div>
        <p class="pu-contacto__promo">Promoción: asesoría gratuita + 15% de descuento en tu primer servicio.</p>
    </div>
</section>
